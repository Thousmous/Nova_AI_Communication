<!doctype html><html lang=""><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="小智后端服务(xiaozhi-server)是由华南理工大学刘思源教授团队主导研发的智能终端软硬件体系后端服务系统，专为xiaozhi-esp32开源硬件打造，具备多协议兼容、声纹识别、知识库管理等核心能力。"><meta name="keywords" content="xiaozhi-server，小智服务端，智控台，AI硬件，智能硬件，AI玩具，情感陪伴，聊天机器人，智能家居，车载机器人"><link rel="icon" href="/favicon.ico"><title>智控台</title><script defer="defer" src="/js/app.e6f812fd.js"></script><link href="/css/app.5a7e25c8.css" rel="stylesheet"></head><body><div id="app"></div><script>(function(){function addDeleteBtns(){document.querySelectorAll('.message-item').forEach(function(item){if(item.querySelector('.del-btn-injected'))return;var content=item.querySelector('.message-content');if(!content)return;var btn=document.createElement('i');btn.className='del-btn-injected el-icon-delete';btn.style.cssText='margin-left:8px;cursor:pointer;color:#F56C6C;font-size:14px;';btn.title='删除此条记录';btn.onclick=function(e){e.stopPropagation();var msgItem=item;var recId=msgItem.getAttribute('data-id');if(!recId){alert('该消息没有记录ID，无法删除');return}if(!confirm('确认删除这条聊天记录？删除后不可恢复'))return;var rawToken=localStorage.getItem('token')||'';var token='';try{token=JSON.parse(rawToken).token||rawToken}catch(ex){token=rawToken}fetch('/xiaozhi/agent/chat-history/delete/'+recId,{method:'DELETE',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}}).then(function(r){return r.json()}).then(function(d){if(d.code===0){msgItem.remove()}else{alert(d.msg||'删除失败')}}).catch(function(err){alert('删除失败:'+err.message)})};content.appendChild(btn)})}function addSessionDeleteBtns(){document.querySelectorAll('.session-item').forEach(function(item){if(item.querySelector('.session-del-btn'))return;var btn=document.createElement('i');btn.className='session-del-btn el-icon-delete';btn.style.cssText='position:absolute;right:8px;top:50%;transform:translateY(-50%);cursor:pointer;color:#F56C6C;font-size:14px;opacity:0;transition:opacity 0.3s;z-index:10;';btn.title='删除此会话';item.style.position='relative';item.onmouseenter=function(){btn.style.opacity='1'};item.onmouseleave=function(){btn.style.opacity='0'};btn.onclick=function(e){e.stopPropagation();var sessionId=item.getAttribute('data-session-id');if(!sessionId){alert('无法获取会话ID');return}if(!confirm('确认删除整个会话？所有聊天记录和音频将被删除，不可恢复'))return;var rawToken=localStorage.getItem('token')||'';var token='';try{token=JSON.parse(rawToken).token||rawToken}catch(ex){token=rawToken}fetch('/xiaozhi/agent/chat-history/delete-session/'+sessionId,{method:'DELETE',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}}).then(function(r){return r.json()}).then(function(d){if(d.code===0){item.remove()}else{alert(d.msg||'删除失败')}}).catch(function(err){alert('删除失败:'+err.message)})};item.appendChild(btn)})}var observer=new MutationObserver(function(){addDeleteBtns();addSessionDeleteBtns()});observer.observe(document.body,{childList:true,subtree:true});setTimeout(function(){addDeleteBtns();addSessionDeleteBtns()},1000)})()</script></body></html>
